name: Project 27 Auto Posting

on:
  workflow_dispatch:
  schedule:
    # India time (IST)
    - cron: '15 12 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '45 14 * * *'
      timezone: 'Asia/Kolkata'
    # Moved 5:15 PM to 5:17 PM to reduce GitHub scheduler congestion.
    - cron: '17 17 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '45 19 * * *'
      timezone: 'Asia/Kolkata'

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Project 27
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: '1201488423057804'
        run: node project27.js
